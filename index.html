        const imagemGaleria =
            document.getElementById("imagem-galeria-final");


        let imagemAtual = -1;


        function trocarImagem() {

            let proximaImagem;


            do {

                proximaImagem =
                    Math.floor(
                        Math.random() * imagensGaleria.length
                    );

            } while (
                proximaImagem === imagemAtual &&
                imagensGaleria.length > 1
            );


            imagemAtual = proximaImagem;


            imagemGaleria.style.opacity = 0;


            setTimeout(function() {

                imagemGaleria.src =
                    imagensGaleria[proximaImagem];

                imagemGaleria.style.opacity = 1;

            }, 800);

        }


        trocarImagem();


        setInterval(trocarImagem, 5000);

    <script>

        window.addEventListener('load', function() {

            window.scrollTo(0, 0);

        });


        window.addEventListener('mousemove', function(event) {

            const cursor = document.querySelector('.cursor');


            if (cursor) {

                cursor.style.left = event.clientX + 'px';
                cursor.style.top = event.clientY + 'px';

            }


            const elemento = event.target.closest(
                'a, button, [role="button"]'
            );


            if (cursor) {

                if (elemento) {

                    cursor.classList.add('clicavel');

                } else {

                    cursor.classList.remove('clicavel');

                }

            }


            if (!elemento) {

                const rastro = document.createElement('div');

                rastro.classList.add('cursor-rastro');

                rastro.style.left = event.clientX + 'px';
                rastro.style.top = event.clientY + 'px';

                document.body.appendChild(rastro);


                setTimeout(function() {

                    rastro.remove();

                }, 1000);

            }

        });

    </script>
